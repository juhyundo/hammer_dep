# Configuration for Post-Synthesis Power Analysis

power.inputs:
  level: "syn"          # Tells the power tool to use the post-synthesis netlist
  tb_name: "gcd_tb"     # The top-level module name of your simulation testbench
  tb_dut: "dut"         # The instance name of the GCD block inside the testbench (change if your instance is named differently, e.g., "u_gcd")

  # Optional: If you want to do Dynamic Power Analysis instead of Vectorless Static Power
  # Uncomment the lines below and point it to the waveform file generated by your `sim-syn` task
